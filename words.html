<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>645 Words - Target Marketing Language</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#f7f9fc,#ffffff);
  color: #111;
  padding: 16px;
}

.app { max-width: 560px; margin: auto; }

/* Header */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.back {
  background: white;
  border: 1px solid #ddd;
  padding: 10px 14px;
  border-radius: 14px;
  cursor: pointer;
}

.title { direction: ltr; }

.title h1 {
  margin: 0;
  color: #111;
}

.title p {
  margin: 6px 0 0;
  color: #666;
}

/* Progress */
.progress {
  background: white;
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  margin-bottom: 15px;
}

.bar {
  height: 8px;
  background: #eee;
  border-radius: 999px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#ffd700,#ffb700);
}

/* Search */
.search input {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #ddd;
  margin-bottom: 12px;
}

/* Filters */
.filters {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 12px;
}

.filters button {
  background: white;
  border: 1px solid #ddd;
  padding: 8px 12px;
  border-radius: 999px;
  cursor: pointer;
}

.filters .active {
  background: black;
  color: white;
}

/* Cards */
.card {
  background: white;
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.08);
}

.top-row {
  display: flex;
  justify-content: space-between;
}

.word {
  font-size: 20px;
  font-weight: bold;
}

.id {
  font-size: 12px;
  color: #999;
}

.save {
  cursor: pointer;
}

.saved {
  color: gold;
}

.meaning {
  margin-top: 6px;
  color: #555;
}

.example {
  margin-top: 8px;
  color: #777;
  font-size: 13px;
}

.tag {
  font-size: 11px;
  color: #999;
  margin-top: 6px;
}
</style>
</head>

<body>

<div class="app">

<div class="top">
  <div class="back" onclick="location.href='dashboard.html'">رجوع</div>
  <div class="title">
    <h1>645 Words</h1>
    <p>American System</p>
  </div>
</div>

<div class="progress">
  <div id="pText">0%</div>
  <div class="bar"><div id="pBar" class="fill"></div></div>
</div>

<div class="search">
  <input id="search" placeholder="Search..." onkeyup="render()">
</div>

<div class="filters" id="filters"></div>

<div id="list"></div>

</div>

<script>

const words = [
{ id:1,cat:"Daily Life",w:"Time",m:"وقت",e:"Time is important."},
{ id:2,cat:"Daily Life",w:"Day",m:"يوم",e:"Have a great day."},
{ id:3,cat:"Daily Life",w:"Home",m:"منزل",e:"I am home."},
{ id:4,cat:"Basic Verbs",w:"Work",m:"عمل",e:"I work daily."},
{ id:5,cat:"Business",w:"Market",m:"سوق",e:"The market grows."},
{ id:6,cat:"Marketing",w:"Brand",m:"علامة",e:"Build brand."},
{ id:7,cat:"Money",w:"Money",m:"مال",e:"Money is a tool."},
{ id:8,cat:"Travel",w:"Airport",m:"مطار",e:"At airport."},
{ id:9,cat:"Self Dev",w:"Success",m:"نجاح",e:"Success needs work."},
{ id:10,cat:"Tech",w:"Internet",m:"إنترنت",e:"Use internet."}
];

let cat="All";

function cats(){
  let c=["All"];
  words.forEach(w=>{ if(!c.includes(w.cat)) c.push(w.cat); });
  return c;
}

function draw(){
  filters.innerHTML="";
  cats().forEach(c=>{
    filters.innerHTML+=`<button class="${cat==c?'active':''}" onclick="setCat('${c}')">${c}</button>`;
  });
}

function setCat(c){ cat=c; draw(); render(); }

function render(){
  let v=search.value.toLowerCase();
  let saved=JSON.parse(localStorage.getItem("saved")||"[]");

  list.innerHTML="";

  let f=words.filter(w=>
    (cat=="All"||w.cat==cat)&&
    (w.w.toLowerCase().includes(v)||w.m.includes(v))
  );

  f.forEach(w=>{
    list.innerHTML+=`
    <div class="card">
      <div class="top-row">
        <div>
          <div class="id">#${w.id}</div>
          <div class="word">${w.w}</div>
        </div>
        <div class="save ${saved.includes(w.id)?'saved':''}" onclick="toggle(${w.id},this)">★</div>
      </div>

      <div class="tag">${w.cat}</div>
      <div class="meaning">${w.m}</div>
      <div class="example">${w.e}</div>
    </div>`;
  });

  let p=Math.round((saved.length/words.length)*100);
  pText.innerText=p+"%";
  pBar.style.width=p+"%";
}

function toggle(id,el){
  let s=JSON.parse(localStorage.getItem("saved")||"[]");
  if(s.includes(id)){s=s.filter(x=>x!=id);el.classList.remove("saved");}
  else{s.push(id);el.classList.add("saved");}
  localStorage.setItem("saved",JSON.stringify(s));
  render();
}

draw();
render();

</script>

</body>
</html>
