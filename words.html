<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>645 Words - Target Marketing Language</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, rgba(212,175,55,.15), transparent 30%),
    #050505;
  color: #fff;
  padding: 16px;
}

.app {
  max-width: 560px;
  margin: auto;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 12px 0 18px;
}

.back {
  background: #111;
  border: 1px solid #333;
  color: #fff;
  padding: 10px 14px;
  border-radius: 14px;
  cursor: pointer;
}

.title {
  text-align: left;
  direction: ltr;
}

.title h1 {
  margin: 0;
  color: #ffd700;
  font-size: 22px;
}

.title p {
  margin: 6px 0 0;
  color: #aaa;
  font-size: 13px;
}

.progress {
  background: linear-gradient(180deg, #171717, #0d0d0d);
  border: 1px solid rgba(212,175,55,.25);
  border-radius: 20px;
  padding: 15px;
  margin-bottom: 14px;
}

.progress-text {
  display: flex;
  justify-content: space-between;
  color: #ddd;
  font-size: 14px;
  margin-bottom: 10px;
}

.bar {
  height: 10px;
  background: #222;
  border-radius: 999px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(135deg, #ffd700, #d4af37);
}

.search-box {
  margin-bottom: 12px;
}

.search-box input {
  width: 100%;
  padding: 15px;
  border-radius: 16px;
  border: 1px solid #333;
  background: #111;
  color: white;
  font-size: 15px;
  outline: none;
}

.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 12px;
}

.filter-btn {
  white-space: nowrap;
  background: #111;
  color: #ddd;
  border: 1px solid #333;
  padding: 9px 13px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 13px;
}

.filter-btn.active {
  background: linear-gradient(135deg, #ffd700, #d4af37);
  color: #111;
  border-color: #d4af37;
  font-weight: bold;
}

.word-card {
  background: linear-gradient(180deg, #171717, #0d0d0d);
  border: 1px solid #292929;
  border-radius: 22px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 18px 45px rgba(0,0,0,.35);
}

.word-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.word-id {
  color: #d4af37;
  font-size: 13px;
  font-weight: bold;
  direction: ltr;
}

.word {
  direction: ltr;
  font-size: 23px;
  font-weight: 900;
  color: #fff;
  margin-top: 5px;
}

.save {
  color: #666;
  font-size: 25px;
  cursor: pointer;
}

.save.saved {
  color: #ffd700;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}

.tag {
  background: rgba(212,175,55,.10);
  border: 1px solid rgba(212,175,55,.25);
  color: #d4af37;
  padding: 6px 9px;
  border-radius: 999px;
  font-size: 12px;
}

.meaning {
  margin-top: 10px;
  color: #fff;
  font-size: 15px;
}

.example {
  direction: ltr;
  text-align: left;
  margin-top: 10px;
  color: #ccc;
  font-size: 14px;
  line-height: 1.6;
}

.empty {
  text-align: center;
  color: #888;
  padding: 30px 0;
}

@media (max-width: 480px) {
  .title h1 { font-size: 19px; }
  .word { font-size: 20px; }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <button class="back" onclick="location.href='dashboard.html'">رجوع</button>
    <div class="title">
      <h1>645 Essential Words</h1>
      <p>American English System</p>
    </div>
  </div>

  <div class="progress">
    <div class="progress-text">
      <span>تقدمك</span>
      <span id="progressText">0%</span>
    </div>
    <div class="bar">
      <div class="bar-fill" id="barFill"></div>
    </div>
  </div>

  <div class="search-box">
    <input id="search" placeholder="Search word or meaning..." onkeyup="renderWords()">
  </div>

  <div class="filters" id="filters"></div>

  <div id="wordsContainer"></div>

</div>

<script>
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "index.html";
}

let currentCategory = "All";

const words = [
  {
    id: 1,
    category: "Daily Life",
    word: "Time",
    pronunciation: "تايم",
    meaning: "وقت",
    example: "Time is very important in life."
  },
  {
    id: 2,
    category: "Daily Life",
    word: "Day",
    pronunciation: "داي",
    meaning: "يوم",
    example: "Have a great day."
  },
  {
    id: 3,
    category: "Daily Life",
    word: "Home",
    pronunciation: "هوم",
    meaning: "منزل",
    example: "I am going home now."
  },
  {
    id: 4,
    category: "Daily Life",
    word: "Food",
    pronunciation: "فود",
    meaning: "طعام",
    example: "The food tastes good."
  },
  {
    id: 5,
    category: "Basic Verbs",
    word: "Work",
    pronunciation: "وورك",
    meaning: "يعمل / عمل",
    example: "I work every day to improve myself."
  },
  {
    id: 6,
    category: "Basic Verbs",
    word: "Learn",
    pronunciation: "ليرن",
    meaning: "يتعلم",
    example: "I learn English every morning."
  },
  {
    id: 7,
    category: "Basic Verbs",
    word: "Build",
    pronunciation: "بيلد",
    meaning: "يبني",
    example: "Build your future step by step."
  },
  {
    id: 8,
    category: "Business",
    word: "Customer",
    pronunciation: "كاستمر",
    meaning: "عميل",
    example: "The customer is always important."
  },
  {
    id: 9,
    category: "Business",
    word: "Market",
    pronunciation: "ماركت",
    meaning: "سوق",
    example: "The market is growing fast this year."
  },
  {
    id: 10,
    category: "Business",
    word: "Partner",
    pronunciation: "بارتنر",
    meaning: "شريك",
    example: "I started a business with my partner."
  },
  {
    id: 11,
    category: "Marketing",
    word: "Brand",
    pronunciation: "براند",
    meaning: "علامة تجارية",
    example: "Build your brand with trust."
  },
  {
    id: 12,
    category: "Marketing",
    word: "Content",
    pronunciation: "كونتنت",
    meaning: "محتوى",
    example: "Create useful content every day."
  },
  {
    id: 13,
    category: "Money & Trading",
    word: "Money",
    pronunciation: "ماني",
    meaning: "مال",
    example: "Money is a tool, not a goal."
  },
  {
    id: 14,
    category: "Money & Trading",
    word: "Capital",
    pronunciation: "كابيتال",
    meaning: "رأس مال",
    example: "Protect your capital first."
  },
  {
    id: 15,
    category: "Travel",
    word: "Airport",
    pronunciation: "إيربورت",
    meaning: "مطار",
    example: "I arrived at the airport early."
  },
  {
    id: 16,
    category: "Travel",
    word: "Passport",
    pronunciation: "باسبورت",
    meaning: "جواز سفر",
    example: "Do not forget your passport."
  },
  {
    id: 17,
    category: "Self Development",
    word: "Growth",
    pronunciation: "جروث",
    meaning: "نمو",
    example: "Personal growth takes time."
  },
  {
    id: 18,
    category: "Self Development",
    word: "Success",
    pronunciation: "سكسس",
    meaning: "نجاح",
    example: "Success comes from consistency."
  }
];

function getSaved() {
  return JSON.parse(localStorage.getItem("savedWords") || "[]");
}

function saveWords(saved) {
  localStorage.setItem("savedWords", JSON.stringify(saved));
}

function buildFilters() {
  const categories = ["All", ...new Set(words.map(w => w.category))];
  const filters = document.getElementById("filters");

  filters.innerHTML = categories.map(cat => `
    <button class="filter-btn ${cat === currentCategory ? "active" : ""}" onclick="setCategory('${cat}')">
      ${cat}
    </button>
  `).join("");
}

function setCategory(category) {
  currentCategory = category;
  buildFilters();
  renderWords();
}

function updateProgress() {
  const saved = getSaved();
  const percent = Math.round((saved.length / words.length) * 100);

  document.getElementById("progressText").innerText =
    `${saved.length}/${words.length} - ${percent}%`;

  document.getElementById("barFill").style.width = percent + "%";
}

function renderWords() {
  const searchValue = document.getElementById("search").value.toLowerCase().trim();
  const saved = getSaved();

  let filtered = words.filter(item => {
    const matchCategory = currentCategory === "All" || item.category === currentCategory;
    const matchSearch =
      item.word.toLowerCase().includes(searchValue) ||
      item.meaning.includes(searchValue) ||
      item.category.toLowerCase().includes(searchValue);

    return matchCategory && matchSearch;
  });

  const container = document.getElementById("wordsContainer");

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty">لا توجد نتائج</div>`;
    updateProgress();
    return;
  }

  container.innerHTML = filtered.map(item => {
    const isSaved = saved.includes(item.id);

    return `
      <div class="word-card">
        <div class="word-top">
          <div>
            <div class="word-id">#${String(item.id).padStart(3, "0")}</div>
            <div class="word">${item.word}</div>
          </div>

          <div class="save ${isSaved ? "saved" : ""}" onclick="toggleSave(${item.id})">★</div>
        </div>

        <div class="meta">
          <div class="tag">${item.category}</div>
          <div class="tag">النطق: ${item.pronunciation}</div>
        </div>

        <div class="meaning">المعنى: ${item.meaning}</div>
        <div class="example">${item.example}</div>
      </div>
    `;
  }).join("");

  updateProgress();
}

function toggleSave(id) {
  let saved = getSaved();

  if (saved.includes(id)) {
    saved = saved.filter(item => item !== id);
  } else {
    saved.push(id);
  }

  saveWords(saved);
  renderWords();
}

buildFilters();
renderWords();
</script>

</body>
</html>
