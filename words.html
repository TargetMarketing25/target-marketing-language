    margin:0;
    font-family:Arial;
    background:#000;
    color:#fff;
}

/* Header */

    padding:20px;
}
.title{
    color:#FFD700;
    font-size:28px;
    font-weight:bold;
}
.sub{
    color:#aaa;
}

.progress{

    border-radius:20px;
    height:10px;

}

    padding:12px;

    border:1px solid #333;

    color:#fff;

}
.cat{

    border-radius:20px;
    background:#111;
    border:1px solid #333;
    cursor:pointer;

.cat.active{

    color:#000;
}

/* Card */
.card{
    background:#0c0c0c;
    border:1px solid #222;
    border-radius:15px;
    padding:15px;
    margin:10px 0;
}
.word{
    font-size:20px;
    font-weight:bold;
}
.mean{
    color:#FFD700;
}
.example{

    margin-top:10px;

.num{

    font-size:12px;

}
