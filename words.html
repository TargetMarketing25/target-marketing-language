*{box-sizing:border-box}
body{
  margin:0;font-family:Arial;background:#050505;color:#fff;padding:16px
}
.app{max-width:560px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.back{background:#111;border:1px solid #333;color:#fff;padding:10px 14px;border-radius:14px;cursor:pointer}
.title{direction:ltr;text-align:left}
.title h1{margin:0;color:#ffd700;font-size:22px}
.title p{margin:6px 0 0;color:#aaa;font-size:13px}

.progress{background:#111;border:1px solid #333;border-radius:16px;padding:12px;margin-bottom:12px}
.progress-text{display:flex;justify-content:space-between;color:#ddd;font-size:13px;margin-bottom:8px}
.bar{height:8px;background:#222;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;width:0;background:linear-gradient(135deg,#ffd700,#d4af37)}

.search input{
  width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;margin-bottom:10px
}

.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.filters button{
  background:#111;border:1px solid #333;color:#ccc;padding:8px 10px;border-radius:999px;cursor:pointer;font-size:12px
}
.filters .active{background:gold;color:#000;font-weight:bold}

.word-card{
  background:#111;border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:10px
}
.word-top{display:flex;justify-content:space-between;align-items:center}
.word{direction:ltr;font-size:18px;font-weight:bold}
.id{color:gold;font-size:12px}
.save{cursor:pointer;font-size:18px}
.saved{color:gold}
.tag{font-size:11px;color:gold;margin-top:5px}
.meaning{color:#ccc;margin-top:6px}
.example{direction:ltr;margin-top:8px;font-size:13px;color:#aaa}

let cat="All";

function getCats(){
  let c=["All"];
  words.forEach(w=>{ if(!c.includes(w.cat)) c.push(w.cat); });
  return c;
}

function drawFilters(){
  filters.innerHTML="";
  getCats().forEach(c=>{
    filters.innerHTML+=`<button class="${cat==c?'active':''}" onclick="setCat('${c}')">${c}</button>`;
  });
}

function setCat(c){ cat=c; drawFilters(); render(); }

function render(){
  let v=search.value.toLowerCase();
  let saved=JSON.parse(localStorage.getItem("saved")||"[]");
  list.innerHTML="";

  let filtered = words.filter(w=>
    (cat=="All"||w.cat==cat) &&
    (w.w.toLowerCase().includes(v)||w.m.includes(v))
  );

  filtered.forEach(w=>{
    list.innerHTML+=`
    <div class="word-card">
      <div class="word-top">
        <div>
          <div class="id">#${w.id}</div>
          <div class="word">${w.w}</div>
        </div>
        <div class="save ${saved.includes(w.id)?'saved':''}" onclick="toggle(${w.id},this)">★</div>
      </div>
      <div class="tag">${w.cat}</div>
      <div class="meaning">${w.m}</div>
      <div class="example">${w.e}</div>
    </div>`;
  });

  let percent = Math.round((saved.length / words.length) * 100);
  pText.innerText = percent + "%";
  pBar.style.width = percent + "%";
}

function toggle(id,el){
  let s=JSON.parse(localStorage.getItem("saved")||"[]");
  if(s.includes(id)){ s=s.filter(x=>x!=id); el.classList.remove("saved"); }
  else{ s.push(id); el.classList.add("saved"); }
  localStorage.setItem("saved",JSON.stringify(s));
  render();
}

drawFilters();
render();
