<!DOCTYPE html>

<title>645 Words - Target Marketing Language</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,rgba(212,175,55,.14),transparent 28%),
    #050505;
  color:#fff;
  padding:16px;
}
.app{max-width:560px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.back{background:#111;border:1px solid #333;color:white;padding:10px 14px;border-radius:14px;cursor:pointer}
.title{direction:ltr;text-align:left}
.title h1{margin:0;color:#ffd700;font-size:24px}
.title p{margin:5px 0 0;color:#aaa}
.progress{background:#111;border:1px solid #222;padding:13px;border-radius:18px;margin-bottom:14px}
.progress-text{display:flex;justify-content:space-between;margin-bottom:8px;color:#ccc}
.bar{height:8px;background:#222;border-radius:999px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#ffd700,#d4af37)}
.search input{width:100%;padding:14px;border-radius:14px;border:1px solid #333;background:#111;color:#fff;margin-bottom:12px;font-size:15px}
.filters{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:6px}
.filters button{background:#111;border:1px solid #333;color:#ccc;padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.filters .active{background:#ffd700;color:#111;font-weight:bold}
.card{background:#111;border:1px solid #252525;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 16px 35px rgba(0,0,0,.35)}
.row{display:flex;justify-content:space-between;align-items:flex-start}
.id{color:#ffd700;font-size:13px;font-weight:bold;direction:ltr}
.word{font-size:24px;font-weight:900;direction:ltr;text-align:left}
.save{font-size:24px;color:#666;cursor:pointer}
.saved{color:#ffd700}
.tag{display:inline-block;margin-top:8px;color:#ffd700;font-size:12px;border:1px solid rgba(212,175,55,.25);padding:5px 9px;border-radius:999px}
.pron{margin-top:8px;color:#aaa}
.meaning{margin-top:6px;color:#fff;font-size:16px}

.example{margin-top:12px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.example-en{direction:ltr;text-align:left;color:#ddd;font-size:14px}
.example-ar{direction:rtl;text-align:right;color:#d4af37;margin-top:7px;font-size:14px}

.empty{text-align:center;color:#777;padding:30px}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <button class="back" onclick="location.href='dashboard.html'">رجوع</button>
    <div class="title">
      <h1>645 Words</h1>

    </div>
  </div>

    </div>

  </div>

  <div class="search">
    <input id="search" placeholder="Search word or meaning..." onkeyup="render()">
  </div>

  <div class="filters" id="filters"></div>
  <div id="list"></div>

</div>

let currentCat="All";

function savedList(){
  return JSON.parse(localStorage.getItem("savedWords")||"[]");
}

function drawFilters(){
  const cats=["All",...new Set(words.map(x=>x.cat))];
  filters.innerHTML=cats.map(c=>`
    <button class="${c===currentCat?'active':''}" onclick="setCat('${c}')">${c}</button>
  `).join("");
}

function setCat(c){
  currentCat=c;
  drawFilters();
  render();
}

function render(){
  const q=search.value.toLowerCase().trim();
  const saved=savedList();

  const filtered=words.filter(x=>{
    return (currentCat==="All"||x.cat===currentCat) &&
    (x.w.toLowerCase().includes(q) || x.m.includes(q));
  });

  list.innerHTML=filtered.map(x=>`
    <div class="card">
      <div class="row">
        <div>
          <div class="id">#${String(x.id).padStart(3,"0")}</div>
          <div class="word">${x.w}</div>
        </div>
        <div class="save ${saved.includes(x.id)?'saved':''}" onclick="toggleSave(${x.id})">★</div>
      </div>

      <div class="tag">${x.cat}</div>
      <div class="pron">النطق: ${x.p}</div>
      <div class="meaning">المعنى: ${x.m}</div>

      <div class="example">
        <div class="example-en">${x.e}</div>
        <div class="example-ar">${x.ar}</div>
      </div>
    </div>
  `).join("");

  const percent=Math.round((saved.length/words.length)*100);
  pText.innerText=`${saved.length}/${words.length} - ${percent}%`;
  pBar.style.width=percent+"%";
}

function toggleSave(id){
  let saved=savedList();
  saved.includes(id) ? saved=saved.filter(x=>x!==id) : saved.push(id);
  localStorage.setItem("savedWords",JSON.stringify(saved));
  render();
}

drawFilters();
render();
</script>
