<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>645 Words</title>

<style>
body{
margin:0;
font-family:Arial;
background:#000;
color:#fff;
padding:15px;
}

.app{max-width:550px;margin:auto}

/* HEADER */
.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.back{
background:#111;
padding:10px 15px;
border-radius:12px;
cursor:pointer;
}

.title{
direction:ltr;
}

.title h1{
margin:0;
color:#ffd700;
}

.title p{
margin:5px 0 0;
color:#aaa;
}

/* PROGRESS */
.progress{
background:#111;
padding:12px;
border-radius:15px;
margin-bottom:15px;
}

.bar{
height:8px;
background:#222;
border-radius:10px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#ffd700,#ffb700);
}

/* SEARCH */
.search input{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #333;
background:#111;
color:#fff;
margin-bottom:10px;
}

/* FILTER */
.filters{
display:flex;
gap:6px;
overflow-x:auto;
margin-bottom:10px;
}

.filters button{
background:#111;
border:1px solid #333;
color:#ccc;
padding:7px 10px;
border-radius:20px;
cursor:pointer;
}

.filters .active{
background:#ffd700;
color:#000;
}

/* CARD */
.card{
background:#111;
border-radius:15px;
padding:15px;
margin-bottom:10px;
border:1px solid #222;
}

.row{
display:flex;
justify-content:space-between;
}

.word{
font-size:20px;
direction:ltr;
font-weight:bold;
}

.id{color:#ffd700;font-size:12px}

.meaning{color:#ccc;margin-top:6px}

.example{
direction:ltr;
margin-top:8px;
font-size:13px;
color:#aaa;
}

.tag{
font-size:11px;
color:#ffd700;
margin-top:5px;
}

.save{
cursor:pointer;
font-size:18px;
}

.saved{color:#ffd700}

</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="back" onclick="location.href='dashboard.html'">رجوع</div>
<div class="title">
<h1>645 Words</h1>
<p>American System</p>
</div>
</div>

<div class="progress">
<div id="pText">0%</div>
<div class="bar"><div id="pBar" class="fill"></div></div>
</div>

<div class="search">
<input id="search" placeholder="Search..." onkeyup="render()">
</div>

<div class="filters" id="filters"></div>

<div id="list"></div>

</div>

<script>

const words = [];

const catsList=["Daily Life","Basic Verbs","Business","Marketing","Money","Travel","Self Dev","Tech","Extra"];

for(let i=1;i<=100;i++){
words.push({
id:i,
cat:catsList[i%catsList.length],
w:"Word "+i,
m:"معنى الكلمة "+i,
e:"Example sentence "+i
});
}

let cat="All";

function getCats(){
let c=["All"];
words.forEach(w=>{if(!c.includes(w.cat))c.push(w.cat)});
return c;
}

function draw(){
filters.innerHTML="";
getCats().forEach(c=>{
filters.innerHTML+=`<button class="${cat==c?'active':''}" onclick="setCat('${c}')">${c}</button>`;
});
}

function setCat(c){
cat=c;
draw();
render();
}

function render(){
let v=search.value.toLowerCase();
let saved=JSON.parse(localStorage.getItem("saved")||"[]");

list.innerHTML="";

let f=words.filter(w=>
(cat=="All"||w.cat==cat)&&
(w.w.toLowerCase().includes(v)||w.m.includes(v))
);

f.forEach(w=>{
list.innerHTML+=`
<div class="card">
<div class="row">
<div>
<div class="id">#${w.id}</div>
<div class="word">${w.w}</div>
</div>
<div class="save ${saved.includes(w.id)?'saved':''}" onclick="toggle(${w.id},this)">★</div>
</div>

<div class="tag">${w.cat}</div>
<div class="meaning">${w.m}</div>
<div class="example">${w.e}</div>
</div>
`;
});

let p=Math.round((saved.length/words.length)*100);
pText.innerText=p+"%";
pBar.style.width=p+"%";
}

function toggle(id,el){
let s=JSON.parse(localStorage.getItem("saved")||"[]");

if(s.includes(id)){
s=s.filter(x=>x!=id);
el.classList.remove("saved");
}else{
s.push(id);
el.classList.add("saved");
}

localStorage.setItem("saved",JSON.stringify(s));
render();
}

draw();
render();

</script>

</body>
</html>
