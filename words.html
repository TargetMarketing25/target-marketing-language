<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Words</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050505;
  color: white;
  padding: 15px;
}

.card {
  background: #111;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 10px;
}

.word {
  font-weight: bold;
}

button {
  margin-top: 5px;
}
</style>
</head>

<body>

<button onclick="location.href='dashboard.html'">رجوع</button>

<div id="words"></div>

<script>
const data = [
{w:"Time",m:"وقت",e:"Time is important."},
{w:"Work",m:"عمل",e:"I work every day."},
{w:"Money",m:"مال",e:"Money is useful."}
];

function show(){
  words.innerHTML="";
  data.forEach(x=>{
    words.innerHTML+=`
    <div class="card">
      <div class="word">${x.w}</div>
      <div>${x.m}</div>
      <div>${x.e}</div>
    </div>`;
  });
}

show();
</script>

</body>
</html>
