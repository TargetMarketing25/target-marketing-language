<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Target Marketing Language</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, rgba(212,175,55,0.15), transparent 30%),
    radial-gradient(circle at bottom right, rgba(0,80,180,0.15), transparent 40%),
    #050505;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: linear-gradient(180deg, #171717, #0d0d0d);
  border-radius: 28px;
  padding: 34px 24px 26px;
  border: 1px solid rgba(212,175,55,0.25);
  box-shadow:
    0 30px 80px rgba(0,0,0,0.65),
    0 0 30px rgba(212,175,55,0.08);
  text-align: center;
}

/* 🔥 LOGO HERO */
.logo-wrap {
  width: 100%;
  margin: 0 auto 10px;
  display: flex;
  justify-content: center;
}

.logo-wrap img {
  width: 280px;
  max-width: 80%;
  height: auto;
  filter:
    drop-shadow(0 30px 50px rgba(0,0,0,0.7))
    drop-shadow(0 0 35px rgba(212,175,55,0.25));
}

/* Subtitle */
.subtitle {
  color: #d8d8d8;
  font-size: 15px;
  margin: 10px 0 28px;
  line-height: 1.7;
}

/* Form */
.form {
  text-align: left;
  direction: ltr;
}

input {
  width: 100%;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 14px;
  border: 1px solid #333;
  background: #111;
  color: #fff;
  font-size: 15px;
  outline: none;
}

input::placeholder {
  color: #888;
}

input:focus {
  border-color: #d4af37;
  box-shadow: 0 0 0 3px rgba(212,175,55,0.15);
}

/* Button */
button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #ffd700, #d4af37);
  color: #111;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-1px);
}

/* Error */
.error {
  color: #ff4d4d;
  margin-top: 10px;
  font-size: 13px;
}

/* Footer */
.footer {
  margin-top: 20px;
  font-size: 12px;
  color: #777;
}

/* 📱 Mobile */
@media (max-width: 480px) {

  .login-card {
    padding: 26px 18px;
  }

  .logo-wrap img {
    width: 230px;
  }

  .subtitle {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="login-card">

  <!-- 🔥 LOGO -->
  <div class="logo-wrap">
    <img src="logo.png" alt="Target Marketing Logo">
  </div>

  <!-- Subtitle -->
  <div class="subtitle">
    ابدأ تعلم اللغات بطريقة عملية ومنظمة
  </div>

  <!-- Form -->
  <div class="form">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">دخول المنصة</button>
  </div>

  <div class="error" id="error"></div>

  <div class="footer">© Target Marketing Academy</div>

</div>

<script>
function login() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();

  if (user === "student" && pass === "target2026") {
    localStorage.setItem("loggedIn", "true");
    window.location.href = "dashboard.html";
  } else {
    document.getElementById("error").innerText = "بيانات الدخول غير صحيحة";
  }
}
</script>

</body>
</html>
