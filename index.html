<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Target Marketing Language</title>
<meta name="theme-color" content="#050505">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(255,215,0,0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(0,112,255,0.20), transparent 35%),
        #050505;
    color: white;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: rgba(20,20,20,0.92);
    border: 1px solid rgba(255,215,0,0.25);
    border-radius: 24px;
    padding: 32px 26px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    position: relative;
    overflow: hidden;
}

.login-box::before {
    content: "EN • AR • FR • DE";
    position: absolute;
    top: 14px;
    right: -42px;
    background: gold;
    color: #111;
    font-size: 12px;
    font-weight: bold;
    padding: 7px 48px;
    transform: rotate(35deg);
}

.logo {
    width: 110px;
    margin-bottom: 15px;
}

.badge {
    display: inline-block;
    background: rgba(255,215,0,0.12);
    border: 1px solid rgba(255,215,0,0.35);
    color: gold;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    margin-bottom: 15px;
}

h1 {
    margin: 0;
    color: gold;
    font-size: 28px;
    line-height: 1.2;
}

.subtitle {
    color: #ddd;
    margin: 12px 0 8px;
    font-size: 15px;
}

.ar-text {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 24px;
}

.language-icons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
}

.language-icons span {
    background: #222;
    border: 1px solid #333;
    padding: 8px 10px;
    border-radius: 12px;
    font-size: 13px;
}

input {
    width: 100%;
    padding: 15px;
    margin: 9px 0;
    border: 1px solid #333;
    border-radius: 14px;
    outline: none;
    font-size: 16px;
    background: #101010;
    color: white;
}

input:focus {
    border-color: gold;
    box-shadow: 0 0 0 3px rgba(255,215,0,0.12);
}

button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #ffd700, #d4af37);
    border: none;
    border-radius: 14px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    margin-top: 12px;
    color: #111;
}

button:hover {
    transform: translateY(-1px);
}

.error {
    color: #ff4d4d;
    margin-top: 12px;
    font-size: 14px;
}

.footer {
    margin-top: 22px;
    color: #777;
    font-size: 12px;
}

@media (max-width: 480px) {
    body {
        padding: 14px;
    }

    .login-box {
        padding: 28px 20px;
        border-radius: 20px;
    }

    .logo {
        width: 92px;
    }

    h1 {
        font-size: 23px;
    }

    input, button {
        font-size: 15px;
        padding: 13px;
    }
}
</style>
</head>

<body>

<div class="login-box">
    <img src="logo.png" alt="Target Marketing Logo" class="logo">

    <div class="badge">Language Learning Portal</div>

    <h1>Target Marketing Language</h1>

    <div class="subtitle">Learn English the Smart Way</div>
    <div class="ar-text">ابدأ رحلتك في تعلم اللغات بطريقة عملية ومنظمة</div>

    <div class="language-icons">
        <span>🇬🇧 English</span>
        <span>🇩🇪 German</span>
        <span>🇫🇷 French</span>
    </div>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">دخول المنصة</button>

    <div class="error" id="error"></div>

    <div class="footer">© Target Marketing Academy</div>
</div>

<script>
function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (user === "student" && pass === "target2026") {
        localStorage.setItem("loggedIn", "true");
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("error").innerText = "بيانات الدخول غير صحيحة";
    }
}
</script>

</body>
</html>
