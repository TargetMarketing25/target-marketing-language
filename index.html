<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Target Marketing Language</title>
<meta name="theme-color" content="#050505" />

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, rgba(212,175,55,0.16), transparent 28%),
    radial-gradient(circle at bottom right, rgba(0,80,180,0.20), transparent 35%),
    #050505;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.login-card {
  width: 100%;
  max-width: 440px;
  background: linear-gradient(180deg, #171717, #0d0d0d);
  border-radius: 28px;
  padding: 34px 26px 28px;
  border: 1px solid rgba(212,175,55,0.30);
  box-shadow:
    0 30px 80px rgba(0,0,0,0.65),
    0 0 35px rgba(212,175,55,0.08);
  text-align: center;
}

.logo-wrap {
  width: 190px;
  height: 190px;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-wrap img {
  width: 180px;
  max-height: 180px;
  object-fit: contain;
  filter: drop-shadow(0 18px 26px rgba(0,0,0,0.45));
}

h1 {
  margin: 4px 0 10px;
  font-size: 30px;
  line-height: 1.2;
  color: #fff;
  direction: ltr;
}

.highlight {
  color: #d4af37;
}

.subtitle {
  color: #d8d8d8;
  font-size: 15px;
  line-height: 1.8;
  margin: 0 0 28px;
}

.form {
  text-align: left;
  direction: ltr;
}

input {
  width: 100%;
  padding: 16px;
  margin-bottom: 13px;
  border-radius: 15px;
  border: 1px solid #333;
  background: #111;
  color: #fff;
  font-size: 16px;
  outline: none;
}

input::placeholder {
  color: #888;
}

input:focus {
  border-color: #d4af37;
  box-shadow: 0 0 0 4px rgba(212,175,55,0.12);
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 4px;
  border: none;
  border-radius: 15px;
  background: linear-gradient(135deg, #ffd700, #d4af37);
  color: #111;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
  transition: 0.25s;
}

button:hover {
  transform: translateY(-1px);
}

.error {
  min-height: 20px;
  color: #ff4d4d;
  margin-top: 12px;
  font-size: 14px;
}

.footer {
  margin-top: 20px;
  color: #777;
  font-size: 12px;
}

@media (max-width: 480px) {
  .login-card {
    padding: 28px 20px 24px;
    border-radius: 24px;
  }

  .logo-wrap {
    width: 150px;
    height: 150px;
    margin-bottom: 14px;
  }

  .logo-wrap img {
    width: 145px;
    max-height: 145px;
  }

  h1 {
    font-size: 24px;
  }

  .subtitle {
    font-size: 14px;
  }

  input, button {
    font-size: 15px;
    padding: 14px;
  }
}
</style>
</head>

<body>

<div class="login-card">

  <div class="logo-wrap">
    <img src="logo.png" alt="Target Marketing Logo">
  </div>

  <h1>Target Marketing <span class="highlight">Language</span></h1>

  <div class="subtitle">
    ابدأ تعلم اللغات بطريقة عملية ومنظمة
  </div>

  <div class="form">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">دخول المنصة</button>
  </div>

  <div class="error" id="error"></div>
  <div class="footer">© Target Marketing Academy</div>

</div>

<script>
function login() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();

  if (user === "student" && pass === "target2026") {
    localStorage.setItem("loggedIn", "true");
    window.location.href = "dashboard.html";
  } else {
    document.getElementById("error").innerText = "بيانات الدخول غير صحيحة";
  }
}
</script>

</body>
</html>
