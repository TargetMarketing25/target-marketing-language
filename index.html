<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Target Marketing Language</title>
<meta name="theme-color" content="#ffffff" />

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(0, 102, 255, 0.12), transparent 30%),
    linear-gradient(135deg, #f7f9fc, #ffffff);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  color: #111;
}

.login-card {
  width: 100%;
  max-width: 430px;
  background: #ffffff;
  border-radius: 28px;
  padding: 32px 26px;
  box-shadow: 0 22px 60px rgba(0,0,0,0.10);
  border: 1px solid #eeeeee;
  text-align: center;
}

.logo-wrap {
  width: 108px;
  height: 108px;
  margin: 0 auto 18px;
  border-radius: 26px;
  background: #080808;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 14px 35px rgba(0,0,0,0.18);
}

.logo-wrap img {
  width: 82px;
  max-height: 82px;
  object-fit: contain;
}

.badge {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 999px;
  background: #fff6cf;
  color: #9a7400;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 14px;
}

h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.2;
  color: #111;
}

.highlight {
  color: #d4af37;
}

.subtitle {
  color: #555;
  font-size: 15px;
  margin: 12px 0 22px;
  line-height: 1.7;
}

.lang-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 22px;
}

.lang {
  background: #f3f5f8;
  border: 1px solid #e5e7eb;
  padding: 8px 11px;
  border-radius: 12px;
  font-size: 13px;
  color: #333;
}

.form {
  text-align: left;
  direction: ltr;
}

input {
  width: 100%;
  padding: 15px 16px;
  margin-bottom: 12px;
  border-radius: 14px;
  border: 1px solid #e0e0e0;
  background: #fafafa;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #d4af37;
  background: #fff;
  box-shadow: 0 0 0 4px rgba(212,175,55,0.12);
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #111, #2a2a2a);
  color: #ffd95a;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 4px;
}

button:hover {
  transform: translateY(-1px);
}

.error {
  color: #d60000;
  margin-top: 12px;
  font-size: 14px;
  min-height: 20px;
}

.footer {
  margin-top: 18px;
  font-size: 12px;
  color: #999;
}

@media (max-width: 480px) {
  .login-card {
    padding: 28px 20px;
    border-radius: 24px;
  }

  h1 {
    font-size: 24px;
  }

  .logo-wrap {
    width: 92px;
    height: 92px;
    border-radius: 22px;
  }

  .logo-wrap img {
    width: 70px;
  }
}
</style>
</head>

<body>

<div class="login-card">
  <div class="logo-wrap">
    <img src="logo.png" alt="Target Marketing Logo">
  </div>

  <div class="badge">منصة تعلم اللغات</div>

  <h1>
    Target Marketing <span class="highlight">Language</span>
  </h1>

  <div class="subtitle">
    ابدأ تعلم الإنجليزية بطريقة عملية ومنظمة<br>
    وبعدها نضيف لغات جديدة داخل نفس المنصة
  </div>

  <div class="lang-row">
    <div class="lang">🇬🇧 English</div>
    <div class="lang">🇩🇪 German قريبًا</div>
    <div class="lang">🇫🇷 French قريبًا</div>
  </div>

  <div class="form">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login to Platform</button>
  </div>

  <div class="error" id="error"></div>
  <div class="footer">© Target Marketing Academy</div>
</div>

<script>
function login() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();

  if (user === "student" && pass === "target2026") {
    localStorage.setItem("loggedIn", "true");
    window.location.href = "dashboard.html";
  } else {
    document.getElementById("error").innerText = "بيانات الدخول غير صحيحة";
  }
}
</script>

</body>
</html>
