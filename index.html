<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Target Marketing Language</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050505;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* Intro */
.intro {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  animation: fadeOut 1s forwards;
  animation-delay: 1.5s;
}

.intro img {
  width: 220px;
  animation: zoom 1.2s ease;
}

@keyframes zoom {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes fadeOut {
  to { opacity: 0; visibility: hidden; }
}

/* Login */
.card {
  width: 90%;
  max-width: 400px;
  background: #111;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
}

.logo {
  width: 200px;
  margin-bottom: 15px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  border: none;
  background: #222;
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  background: gold;
  border: none;
  border-radius: 10px;
  font-weight: bold;
}

.error {
  color: red;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="intro">
  <img src="logo.png">
</div>

<div class="card">
  <img src="logo.png" class="logo">
  <p>ابدأ تعلم اللغات بطريقة عملية ومنظمة</p>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">دخول</button>

  <div id="error" class="error"></div>
</div>

<script>
function login(){
  let u = username.value;
  let p = password.value;

  if(u==="student" && p==="target2026"){
    localStorage.setItem("loggedIn","true");
    location.href="dashboard.html";
  }else{
    error.innerText="بيانات الدخول غير صحيحة";
  }
}
</script>

</body>
</html>
