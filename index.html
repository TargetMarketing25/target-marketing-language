<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Target Marketing Language</title>
<meta name="theme-color" content="#0d0d0d">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.login-box {
    background: #1a1a1a;
    padding: 30px;
    border-radius: 15px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 0 25px rgba(212,175,55,0.2);
}

h1 {
    color: gold;
    margin-bottom: 10px;
    font-size: 24px;
}

.subtitle {
    color: #ccc;
    margin-bottom: 25px;
    font-size: 14px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    margin: 10px 0;
    border: none;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: gold;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

button:hover {
    background: #d4af37;
}

.error {
    color: #ff4d4d;
    margin-top: 10px;
    font-size: 14px;
}

@media (max-width: 480px) {
    .login-box {
        padding: 25px 20px;
    }

    h1 {
        font-size: 20px;
    }

    input, button {
        font-size: 15px;
        padding: 12px;
    }
}
</style>
</head>

<body>

<div class="login-box">
    <h1>Target Marketing</h1>
    <div class="subtitle">Language Platform</div>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div class="error" id="error"></div>
</div>

<script>
function login() {
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (user === "student" && pass === "target2026") {
        localStorage.setItem("loggedIn", "true");
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("error").innerText = "بيانات الدخول غير صحيحة";
    }
}
</script>

</body>
</html>
