<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrase Module</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top,rgba(212,175,55,.14),transparent 28%),
radial-gradient(circle at bottom right,rgba(0,80,180,.14),transparent 38%),
#050505;
color:#fff;
padding:16px;
}

.app{max-width:560px;margin:auto}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}

.back{
background:#111;
border:1px solid #333;
color:#fff;
padding:10px 14px;
border-radius:14px;
cursor:pointer;
}

.title{
direction:ltr;
text-align:left;
}

.title h1{
margin:0;
color:#ffd700;
font-size:22px;
}

.title p{
margin:5px 0 0;
color:#aaa;
font-size:13px;
}

.search input{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid #333;
background:#111;
color:#fff;
margin-bottom:14px;
font-size:15px;
}

.card{
background:linear-gradient(180deg,#171717,#0d0d0d);
border:1px solid #282828;
border-radius:20px;
padding:16px;
margin-bottom:12px;
box-shadow:0 16px 38px rgba(0,0,0,.32);
}

.id{
color:#ffd700;
font-size:12px;
font-weight:bold;
direction:ltr;
}

.en{
direction:ltr;
text-align:left;
font-size:18px;
font-weight:bold;
margin-top:8px;
}

.ar{
margin-top:10px;
color:#ddd;
line-height:1.7;
}

.note{
margin-top:8px;
color:#999;
font-size:12px;
}

.empty{
text-align:center;
color:#888;
padding:30px 0;
}
</style>
</head>

<body>

<div class="app">

<div class="top">
<button class="back" onclick="location.href='phrases.html'">رجوع</button>
<div class="title">
<h1 id="moduleTitle">Module</h1>
<p id="moduleDesc">Real-Life English</p>
</div>
</div>

<div class="search">
<input id="search" placeholder="Search phrase..." onkeyup="render()">
</div>

<div id="list"></div>

</div>

<script src="phrases-data.js"></script>

<script>
if(localStorage.getItem("loggedIn")!=="true"){
location.href="index.html";
}

const moduleName = localStorage.getItem("currentPhraseModule") || "real-life";

const moduleInfo = {
  "real-life": {
    title: "Module 1: Real-Life Situations",
    desc: "1000 جملة — مواقف يومية حقيقية"
  },
  "daily": {
    title: "Module 2: Daily Conversations",
    desc: "500 جملة — محادثات يومية"
  },
  "restaurants": {
    title: "Module 3: Restaurants & Cafes",
    desc: "400 جملة — مطاعم وكافيهات"
  },
  "work": {
    title: "Module 4: Work & Interviews",
    desc: "600 جملة — شغل وإنترفيو"
  },
  "travel": {
    title: "Module 5: Travel & Airport",
    desc: "500 جملة — سفر ومطار"
  },
  "social": {
    title: "Module 6: Social Media",
    desc: "400 جملة — سوشيال ميديا"
  },
  "relationships": {
    title: "Module 7: Relationships",
    desc: "400 جملة — علاقات"
  },
  "business": {
    title: "Module 8: Business English",
    desc: "700 جملة — Business English"
  },
  "pronunciation": {
    title: "Module 9: Pronunciation Tips",
    desc: "500 جملة — نطق وأنماط كلام"
  }
};

const currentInfo = moduleInfo[moduleName] || moduleInfo["real-life"];
const currentData = phraseModules[moduleName] || [];

document.getElementById("moduleTitle").innerText = currentInfo.title;
document.getElementById("moduleDesc").innerText = currentInfo.desc;

function render(){
const q = document.getElementById("search").value.toLowerCase().trim();

const filtered = currentData.filter(item =>
  item.en.toLowerCase().includes(q) ||
  item.ar.includes(q) ||
  item.note.includes(q)
);

const list = document.getElementById("list");

if(filtered.length===0){
  list.innerHTML = `<div class="empty">لا توجد نتائج</div>`;
  return;
}

list.innerHTML = filtered.map(item => `
  <div class="card">
    <div class="id">#${String(item.id).padStart(3,"0")}</div>
    <div class="en">${item.en}</div>
    <div class="ar">${item.ar}</div>
    <div class="note">${item.note}</div>
  </div>
`).join("");
}

render();
</script>

</body>
</html>
