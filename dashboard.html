<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050505;
  color: white;
  padding: 20px;
}

.card {
  background: #111;
  padding: 20px;
  border-radius: 20px;
  margin-bottom: 15px;
}

.module {
  background: #222;
  padding: 15px;
  border-radius: 15px;
  margin: 10px 0;
  cursor: pointer;
}

button {
  padding: 10px;
  border-radius: 10px;
  background: #333;
  color: white;
}
</style>
</head>

<body>

<div class="card">
  <h2>👋 أهلاً بك</h2>
  <p>ابدأ التعلم</p>
</div>

<div class="card">
  <h3>🇬🇧 English (US)</h3>

  <div class="module" onclick="goWords()">
    645 Words
  </div>

  <div class="module">
    5000 Phrases (Coming Soon)
  </div>
</div>

<button onclick="logout()">Logout</button>

<script>
if(localStorage.getItem("loggedIn")!=="true"){
  location.href="index.html";
}

function goWords(){
  location.href="words.html";
}

function logout(){
  localStorage.removeItem("loggedIn");
  location.href="index.html";
}
</script>

</body>
</html>
